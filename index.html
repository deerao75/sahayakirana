<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahaya Kirana Foundation | Rays of Hope</title>

  <!-- WhatsApp & Social Media Meta Tags -->
  <meta property="og:title" content="Sahaya Kirana Foundation" />
  <meta property="og:description" content="Dedicated to social welfare, education, and health. Bringing rays of hope to those in need." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1593113630400-ea4288922497?q=80&w=1200&auto=format&fit=crop" />
  <meta property="og:type" content="website" />

  <!-- Tailwind CDN (works, but for production prefer bundling Tailwind via PostCSS) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700;12..96,800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --primary: #FF8E3C;
      --secondary: #0D0D2B;
      --warm-bg: #FFFBF7;
    }
    body {
      font-family: 'Bricolage Grotesque', sans-serif;
      background-color: var(--warm-bg);
      color: var(--secondary);
      overflow-x: hidden;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
    }
    .font-serif { font-family: 'Lora', serif; }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .gradient-text {
      background: linear-gradient(135deg, #FF8E3C 0%, #D9376E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .blob-bg {
      position: absolute;
      z-index: -1;
      filter: blur(80px);
      opacity: 0.4;
      border-radius: 50%;
    }
    
  </style>

  <!-- ✅ Remove importmap for Vite builds.
       Vite will bundle react/react-dom/@google/genai from your package.json. -->
</head>

<body>
  <div id="root"></div>

  <!-- ✅ This is the missing piece: it loads your React entry and mounts App into #root -->
  <script type="module" src="/index.tsx"></script>
</body>
</html>
